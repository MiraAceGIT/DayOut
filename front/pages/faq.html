<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Questions fréquentes — DayOut</title>
</head>
<body>
  <main id="app-root" class="container faq-page">
    <h1>Questions fréquentes</h1>
    <p>Inscription, événements, participation : retrouve les réponses à tes questions sur DayOut.</p>
    <p id="faq-status" class="status-message" role="status"></p>
    <p id="faq-error" class="alert alert--error" role="alert"></p>
    <button id="faq-retry" class="button button--primary" type="button" hidden>Réessayer</button>
    <div id="faq-list" class="faq-list" aria-busy="false"></div>
  </main>
</body>
</html>
