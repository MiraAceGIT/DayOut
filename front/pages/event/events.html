<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>DayOut — Événements</title>
</head>
<body>
  <main id="app-root" class="container">
    <h1>Événements à venir</h1>
    <p id="events-error" class="alert alert--error" role="alert"></p>
    <p id="events-status" class="status-message" role="status"></p>
    <section id="events-list" class="card-grid" aria-label="Liste des événements" aria-busy="false"></section>
    <div class="events-pagination">
      <button id="events-more" class="button button--secondary" type="button" aria-controls="events-list" hidden>Voir plus</button>
    </div>
  </main>
</body>
</html>
