<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Confirmation de ton adresse — DayOut</title>
</head>
<body>
  <main id="app-root" class="container confirm-email-page">
    <h1 id="confirm-email-title" tabindex="-1">Confirmation de ton adresse e-mail</h1>
    <p id="confirm-email-status" class="status-message" role="status"></p>
    <p id="confirm-email-error" class="alert alert--error" role="alert"></p>
    <p id="confirm-email-text" class="confirm-email-page__text"></p>
    <div class="confirm-email-page__actions">
      <button id="confirm-email-retry" class="button button--primary" type="button" hidden>Réessayer</button>
      <a id="confirm-email-home" class="button button--primary" href="/" hidden>Découvrir les événements</a>
      <a id="confirm-email-register" class="button button--secondary" href="/register" hidden>Refaire une inscription</a>
    </div>
  </main>
</body>
</html>
