<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DayOut : trouve les événements étudiants inter-écoles autour de toi, sur la carte.">
  <!-- Litteral = --color-brand (tokens.css) : les variables CSS ne sont pas lues ici. -->
  <meta name="theme-color" content="#241238">
  <title>DayOut — Que faire autour de toi ?</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fredoka:wght@600;700&display=swap">
  <!-- Leaflet 1.9.4 epingle + SRI ; avant main.css pour que la charte surcharge ses styles. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>

  <header class="site-header" data-layout></header>

  <main id="main" tabindex="-1">
    <noscript><p class="alert alert--error">JavaScript est nécessaire pour utiliser DayOut.</p></noscript>
  </main>

  <footer class="site-footer" data-layout></footer>

  <p id="route-announcer" class="visually-hidden" role="status"></p>

  <!-- Ecrans : le routeur (src/app/router.js) clone le template de la route dans <main>. -->
  <template id="screen-home">
    <section class="map-panel" aria-labelledby="home-title">
      <h1 id="home-title" class="map-panel__title">Que faire autour de toi ?</h1>

      <div id="home-tabs" class="tabs" role="tablist" aria-label="Choix des événements">
        <button type="button" class="tabs__tab" role="tab" id="home-tab-nearby"
                aria-selected="true" aria-controls="home-panel-nearby">
          À proximité <span aria-hidden="true">·</span> <span id="home-nearby-count">0</span>
        </button>
        <button type="button" class="tabs__tab" role="tab" id="home-tab-foryou"
                aria-selected="false" aria-controls="home-panel-foryou" tabindex="-1">Pour toi</button>
      </div>

      <div id="home-panel-nearby" class="map-panel__tabpanel" role="tabpanel" aria-labelledby="home-tab-nearby">
        <div class="point-card">
          <div class="point-card__row">
            <svg class="point-card__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <p class="point-card__place">
              <span class="point-card__caption">Point choisi</span>
              <span id="home-point-label" class="point-card__label">ISEP – Notre-Dame-des-Champs</span>
            </p>
            <button type="button" id="home-point-change" class="link-button">Changer</button>
          </div>

          <div class="point-card__radius">
            <label class="point-card__radius-label" for="home-radius">Rayon de recherche</label>
            <output id="home-radius-value" class="point-card__radius-value" for="home-radius" aria-hidden="true">3 km</output>
            <input id="home-radius" class="range" type="range" min="1" max="20" step="1" value="3"
                   aria-valuetext="3 km">
            <span class="point-card__bound" aria-hidden="true">1 km</span>
            <span class="point-card__bound point-card__bound--end" aria-hidden="true">20 km</span>
          </div>
        </div>

        <div id="home-filters" class="filter-row" role="group" aria-label="Filtres">
          <button type="button" class="chip" data-filter="weekend" aria-pressed="false">Ce week-end</button>
          <button type="button" class="chip" data-filter="free" aria-pressed="false">Gratuit</button>
          <button type="button" class="chip" data-filter="available" aria-pressed="false">Places disponibles</button>
        </div>

        <div id="home-categories" class="filter-row" role="group" aria-label="Catégories" hidden></div>

        <div class="results-head">
          <p id="home-status" class="results-head__count" role="status"></p>
          <p class="results-head__sort">Triés par date</p>
        </div>
        <p id="home-error" class="alert alert--error" role="alert"></p>
        <ul id="home-list" class="event-list" aria-label="Événements trouvés" aria-busy="false"></ul>
      </div>

      <div id="home-panel-foryou" class="map-panel__tabpanel" role="tabpanel" aria-labelledby="home-tab-foryou" hidden>
        <p class="foryou">
          Connecte-toi pour voir les événements choisis pour toi.
          <a id="home-login-link" href="#/connexion">Se connecter</a>
        </p>
      </div>
    </section>

    <section class="map-view" aria-labelledby="home-map-title">
      <h2 id="home-map-title" class="visually-hidden">Carte des événements</h2>
      <p class="visually-hidden">La liste du panneau reprend tous les événements affichés sur la carte.</p>
      <div id="home-map" class="map-view__map"></div>
      <p class="map-view__hint">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Clique sur la carte pour choisir un point, puis règle le rayon
      </p>
      <p id="home-map-status" class="map-view__status" role="status"></p>
      <div id="home-legend" class="map-legend" hidden>
        <h3 class="map-legend__title">Catégories</h3>
        <ul class="map-legend__list"></ul>
      </div>
    </section>
  </template>

  <template id="screen-events">
    <h1>Événements à venir</h1>
    <p id="events-error" class="alert alert--error" role="alert"></p>
    <p id="events-status" class="status-message" role="status"></p>
    <section id="events-list" class="card-grid" aria-label="Liste des événements" aria-busy="false"></section>
  </template>

  <!-- Le titre est remplace par celui de l'ecran (PlaceholderView). -->
  <template id="screen-placeholder">
    <h1 id="placeholder-title">Bientôt disponible</h1>
    <p>Cette page arrive bientôt.</p>
    <p><a href="#/">Retour à la carte</a></p>
  </template>

  <template id="screen-not-found">
    <h1>Page introuvable</h1>
    <p>L'adresse demandée ne correspond à aucune page de DayOut.</p>
    <p><a href="#/">Retour à la carte</a></p>
  </template>

  <!-- Classiques, avant les modules : config locale optionnelle (ignoree par git) puis Leaflet (global L, SRI). -->
  <script src="src/config.local.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="src/pages/app.js"></script>
</body>
</html>
