tags:
  - name: email-verifications
    description: Confirmation de l'adresse e-mail par le lien recu a l'inscription

paths:
  /email-verifications:
    post:
      tags: [email-verifications]
      summary: Confirmer une adresse e-mail
      description: >-
        Le jeton vient du lien du mail (page front /confirm-email?token=...). Usage unique, valable 24 h.
        Un participant est actif des la confirmation ; un createur aussi, avec sa demande toujours en attente.
        Action de consommation du jeton, pas creation d une ressource : 200 et non 201. Jeton dans le corps (jamais
        dans l URL ni les logs d acces). 30 essais par adresse IP et par heure (429 au-dela).
      operationId: confirmEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailVerificationCreate" }
      responses:
        "200":
          description: Adresse confirmee
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/EmailVerification" }
        "400": { $ref: "#/components/responses/UserBadRequest" }
        "410": { $ref: "#/components/responses/VerificationTokenUsed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/VerificationTokenRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  schemas:
    EmailVerificationCreate:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 128, description: "64 caracteres hexadecimaux" }
    EmailVerification:
      type: object
      required: [email_verified, creator_status]
      properties:
        email_verified: { type: boolean, description: "Toujours true en cas de succes" }
        creator_status: { type: string, enum: [none, pending], description: "pending : demande createur a valider par un admin" }
  responses:
    VerificationTokenUsed:
      description: >-
        Lien qui ne servira plus jamais (410 Gone) : deja utilise (`VERIFICATION_TOKEN_USED`) ou expire
        (`VERIFICATION_TOKEN_EXPIRED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VerificationTokenRejected:
      description: >-
        Jeton absent (`VALIDATION_ERROR`), inconnu ou mal forme (`VERIFICATION_TOKEN_INVALID`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
