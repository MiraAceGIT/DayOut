# Verifications a chaque push sur dev/main et a chaque PR : rien ne merge sans tests verts.
# Memes commandes qu'en local (voir back/README.md et front/README.md, section Tests).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  back:
    name: Back (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.5"] # minimum supporte (readonly class) et version de dev
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Pas de back/.env en CI : config/config.php et reset_db.sh lisent l'environnement.
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: dayout
      TEST_DB_NAME: dayout_test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Dépendances Composer (autoload, PHPStan)
        working-directory: back
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Client MariaDB (reset_db.sh, migrate.sh)
        run: sudo apt-get update -q && sudo apt-get install -y -q mariadb-client

      - name: Syntaxe PHP
        run: find back -name '*.php' -not -path '*/tools/.cache/*' -not -path 'back/vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests unitaires
        run: bash back/tests/run.sh --unit

      - name: Tests d'integration (dayout_test)
        run: bash back/tests/run.sh --integration

      # run.sh a monte dayout_test par les migrations : les rejouer ne doit rien changer.
      - name: Migrations rejouables
        run: bash infra/sql/migrate.sh dayout_test | tee "$RUNNER_TEMP/migrate.out" && grep -qx "Base 'dayout_test' a jour." "$RUNNER_TEMP/migrate.out"

      - name: Analyse statique (PHPStan)
        if: matrix.php == '8.5'
        working-directory: back
        run: composer stan

  front:
    name: Front
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Le test de contrat lit la spec OpenAPI assemblee par le back.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Tests (node --test), contrat avec l'API compris
        working-directory: front
        env:
          REQUIRE_CONTRACT: "1"
        run: node --test "tests/**/*.test.js"

      # Le front reste sans package.json ni build : le script installe tsc dans front/tools/.cache.
      - name: Verification des types (JSDoc, tsc)
        run: bash front/tools/typecheck.sh

  migrations:
    name: Migrations deja mergees intactes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Une migration deja jouee sur une base ne l'est plus jamais : la modifier ne changerait
      # que les nouvelles bases. Idem pour schema/, base de depart gelee. Seuls les ajouts passent.
      - name: Aucun fichier existant de schema/ ou migrations/ modifie ni supprime
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=DMR "$BASE...$HEAD" -- infra/sql/schema infra/sql/migrations)
          if [ -n "$changed" ]; then
            echo "Fichiers deja mergees modifies ou supprimes (ecrire une nouvelle migration a la place) :"
            echo "$changed"
            exit 1
          fi

  commits:
    name: Messages de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Format "type(scope): description" (.githooks/commit-msg)'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            sh .githooks/commit-msg "$RUNNER_TEMP/msg" || { echo "  -> commit $sha"; status=1; }
          done
          exit $status
